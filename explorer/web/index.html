<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank ⇄ Jottacloud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='12' height='18' rx='3' fill='%230a84ff'/%3E%3Crect x='18' y='7' width='12' height='18' rx='3' fill='%235e5ce6'/%3E%3C/svg%3E">
<script>
  try {
    var wantedTheme = new URLSearchParams(location.search).get('theme');
    if (wantedTheme === 'light' || wantedTheme === 'dark') {
      document.documentElement.dataset.theme = wantedTheme;
    } else {
      var savedTheme = localStorage.getItem('explorer-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    }
  } catch (e) { /* ignore */ }
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="2" y="7" width="12" height="18" rx="3" fill="var(--brand-a)"/>
        <rect x="18" y="7" width="12" height="18" rx="3" fill="var(--brand-b)"/>
        <path d="M12.5 16h7" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="m16.6 13.8 2.2 2.2-2.2 2.2" stroke="var(--text-2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>Tank <span class="arrow">⇄</span> <span id="brand-provider">Jottacloud</span></h1>
      <p id="brand-sub">Two-pane filesystem explorer</p>
    </div>
  </div>

  <div class="provider-switch" id="provider-switch" role="tablist" aria-label="Remote provider">
    <button class="provider-choice" data-provider="jottacloud" role="tab" aria-selected="true">
      <span class="provider-dot jottacloud"></span>Jottacloud
    </button>
    <button class="provider-choice" data-provider="google_drive" role="tab" aria-selected="false">
      <span class="provider-dot google_drive"></span>Google Drive
    </button>
  </div>

  <div class="meta-strip" id="meta-strip"></div>

  <div class="appbar-actions">
    <div class="legend-wrap">
      <button id="legend-toggle" class="btn ghost" aria-expanded="false">Legend</button>
      <div id="legend" class="legend" hidden></div>
    </div>
    <label class="toggle" title="Show dotfiles">
      <input type="checkbox" id="hidden-toggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span>Hidden</span>
    </label>
    <button id="theme-toggle" class="btn icon-btn" title="Toggle light / dark">
      <svg class="icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="3.4" fill="currentColor"/>
        <path d="M10 1.6v2M10 16.4v2M1.6 10h2M16.4 10h2M3.9 3.9l1.4 1.4M14.7 14.7l1.4 1.4M16.1 3.9l-1.4 1.4M5.3 14.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M16.5 12.2A7 7 0 0 1 7.8 3.5 7 7 0 1 0 16.5 12.2Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>

<main class="panes" id="panes">

  <section class="pane" id="pane-local" data-side="local">
    <div class="pane-head">
      <div class="pane-title">
        <span class="pane-icon local-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="2.2" y="4" width="15.6" height="4.6" rx="1.4" fill="currentColor" opacity=".9"/>
            <rect x="2.2" y="9.2" width="15.6" height="6.8" rx="1.6" fill="currentColor" opacity=".55"/>
            <circle cx="5" cy="6.3" r=".85" fill="#fff" opacity=".85"/>
          </svg>
        </span>
        <div class="pane-titles">
          <h2>Local index <span class="root-path">/mnt/tank</span></h2>
          <p>file_indexer.db snapshot · not a live mount</p>
        </div>
      </div>
      <div class="pane-badge" data-role="badge"></div>
    </div>

    <div class="pane-toolbar">
      <div class="nav-buttons">
        <button class="btn icon-btn" data-act="back" title="Back" aria-label="Back">
          <svg viewBox="0 0 20 20" fill="none"><path d="m12.2 4.6-5 5.4 5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn icon-btn" data-act="forward" title="Forward" aria-label="Forward">
          <svg viewBox="0 0 20 20" fill="none"><path d="m7.8 4.6 5 5.4-5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn icon-btn" data-act="up" title="Up one folder" aria-label="Up one folder">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 16V4.8M4.9 9.6 10 4.5l5.1 5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="breadcrumbs" data-role="crumbs" aria-label="Path"></nav>
      <button class="btn subtle mirror-btn" data-act="mirror" title="Show the same path in the other pane">
        <span class="mirror-icon">⇄</span><span class="mirror-text">Same path</span>
      </button>
    </div>

    <div class="searchbar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="8.8" cy="8.8" r="5.4" stroke="currentColor" stroke-width="1.6"/>
        <path d="m12.9 12.9 3.4 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input data-role="search" type="search" placeholder="Search local index…" autocomplete="off" spellcheck="false" aria-label="Search local index">
      <select data-role="scope" title="Search scope" aria-label="Search scope">
        <option value="all">Everywhere</option>
        <option value="folder">This folder</option>
      </select>
      <button class="btn icon-btn clear-search" data-role="clear" title="Clear search" hidden aria-label="Clear search">×</button>
    </div>

    <div class="column-head" data-role="columns">
      <button data-sort="name">Name</button>
      <button data-sort="status">Status</button>
      <button data-sort="size">Size</button>
      <button data-sort="modified">Modified</button>
    </div>

    <div class="vlist" data-role="list" tabindex="0">
      <div class="vlist-spacer" data-role="spacer"></div>
      <div class="vlist-body" data-role="body"></div>
      <div class="empty" data-role="empty" hidden></div>
      <div class="loading" data-role="loading" hidden><span class="spinner"></span>Loading…</div>
    </div>

    <div class="pane-foot">
      <span data-role="summary"></span>
      <span class="mini-chips" data-role="chips"></span>
    </div>
  </section>

  <section class="pane" id="pane-remote" data-side="remote">
    <div class="pane-head">
      <div class="pane-title">
        <span class="pane-icon remote-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M10 2.2a5.7 5.7 0 0 1 5.6 4.7 3.9 3.9 0 0 1-.8 7.7H5.4a4.1 4.1 0 0 1-.7-8.1A5.7 5.7 0 0 1 10 2.2Z" fill="currentColor" opacity=".9"/>
            <path d="M10 12.4V8.2M7.9 10l2.1-2.1 2.1 2.1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
          </svg>
        </span>
        <div class="pane-titles">
          <h2><span id="remote-provider-name">Jottacloud</span><span class="pane-sep">·</span><span class="root-path" id="remote-root-name">Archive</span></h2>
          <p id="remote-provider-desc">archive.json snapshot · virtual read-only view</p>
        </div>
      </div>
      <div class="pane-badge" data-role="badge"></div>
    </div>

    <div class="pane-toolbar">
      <div class="nav-buttons">
        <button class="btn icon-btn" data-act="back" title="Back" aria-label="Back">
          <svg viewBox="0 0 20 20" fill="none"><path d="m12.2 4.6-5 5.4 5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn icon-btn" data-act="forward" title="Forward" aria-label="Forward">
          <svg viewBox="0 0 20 20" fill="none"><path d="m7.8 4.6 5 5.4-5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn icon-btn" data-act="up" title="Up one folder" aria-label="Up one folder">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 16V4.8M4.9 9.6 10 4.5l5.1 5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="breadcrumbs" data-role="crumbs" aria-label="Path"></nav>
      <button class="btn subtle mirror-btn" data-act="mirror" title="Show the same path in the other pane">
        <span class="mirror-icon">⇄</span><span class="mirror-text">Same path</span>
      </button>
    </div>

    <div class="searchbar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="8.8" cy="8.8" r="5.4" stroke="currentColor" stroke-width="1.6"/>
        <path d="m12.9 12.9 3.4 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input data-role="search" type="search" placeholder="Search Jottacloud…" autocomplete="off" spellcheck="false" aria-label="Search Jottacloud">
      <select data-role="scope" title="Search scope" aria-label="Search scope">
        <option value="all">Everywhere</option>
        <option value="folder">This folder</option>
      </select>
      <button class="btn icon-btn clear-search" data-role="clear" title="Clear search" hidden aria-label="Clear search">×</button>
    </div>

    <div class="column-head" data-role="columns">
      <button data-sort="name">Name</button>
      <button data-sort="status">Status</button>
      <button data-sort="size">Size</button>
      <button data-sort="modified">Modified</button>
    </div>

    <div class="vlist" data-role="list" tabindex="0">
      <div class="vlist-spacer" data-role="spacer"></div>
      <div class="vlist-body" data-role="body"></div>
      <div class="empty" data-role="empty" hidden></div>
      <div class="loading" data-role="loading" hidden><span class="spinner"></span>Loading…</div>
    </div>

    <div class="pane-foot">
      <span data-role="summary"></span>
      <span class="mini-chips" data-role="chips"></span>
    </div>
  </section>

</main>

<footer class="statusbar">
  <div class="selection" id="selection-info">
    <span class="muted">Select an item to see details.</span>
  </div>
  <button id="reveal-btn" class="btn primary" disabled>
    Reveal counterpart
  </button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
